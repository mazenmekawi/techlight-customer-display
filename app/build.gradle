plugins { id 'com.android.application' }

android {
    namespace 'sa.techlight.printersetup'
    compileSdk 35

    defaultConfig {
        applicationId 'sa.techlight.printersetup'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.5.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java/sa/techlight/printersetup']
            res.srcDirs = ['src/main/res']
        }
        test.java.srcDirs = []
        androidTest.java.srcDirs = []
    }
}
