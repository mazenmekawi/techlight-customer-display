name: Build TechLight Kitchen Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - kds-hybrid-voice-phase1
  pull_request:
    branches:
      - main
      - techpro-kitchen-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Finalize TechPro Kitchen V4
        run: python3 scripts/finalize_kitchen_v4.py

      - name: Route login to TechPro Kitchen V4.2 base
        run: python3 scripts/route_kitchen_v42.py

      - name: Add TechPro TemporaryOrders API resolver
        run: python3 scripts/finalize_kitchen_v43.py

      - name: Switch KDS to TechPro Cloud polling
        run: python3 scripts/finalize_kitchen_v44.py

      - name: Stabilize official API and session isolation
        run: python3 scripts/finalize_kitchen_v45.py

      - name: Apply login baseline and no-flicker deltas
        run: python3 scripts/finalize_kitchen_v46.py

      - name: Auto-detect TechPro API and merge order feeds
        run: python3 scripts/finalize_kitchen_v47.py

      - name: Enable hybrid cashier IP and cloud transport
        run: python3 scripts/finalize_kitchen_v48.py

      - name: Apply TechLight Kitchen Pro generated sources
        run: python3 scripts/apply_kitchen_pro_sources.py

      - name: Verify and repair generated Pro sources
        run: python3 scripts/fix_kitchen_pro_build.py

      - name: Apply TechLight Kitchen Pro 7.1 operational behavior
        run: python3 scripts/finalize_kitchen_pro_v3.py

      - name: Audit requested behavior
        run: |
          grep -q "versionName '7.1.0'" app/build.gradle
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".KitchenProActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".KitchenQrPairingActivity"' app/src/main/AndroidManifest.xml
          grep -q 'oldestFirstComparator' app/src/main/java/sa/techlight/customerdisplay/KitchenProActivity.java
          grep -q 'employeeFromVoice' app/src/main/java/sa/techlight/customerdisplay/KitchenProActivity.java
          grep -q 'toolbarChip("◉  Hi TechPro")' app/src/main/java/sa/techlight/customerdisplay/KitchenProActivity.java
          ! grep -q 'trainingMode' app/src/main/java/sa/techlight/customerdisplay/KitchenProActivity.java
          ! grep -q 'pro_smart_sort' app/src/main/java/sa/techlight/customerdisplay/KitchenProActivity.java

      - name: Run tests and build APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Package APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TechLight-Kitchen-Pro-v7.1.0.apk
          sha256sum dist/TechLight-Kitchen-Pro-v7.1.0.apk > dist/SHA256SUMS.txt

      - name: Upload TechLight Kitchen Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: TechLight-Kitchen-Pro-v7.1-oldest-employee-voice-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
