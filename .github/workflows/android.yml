name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Finalize TechPro Kitchen V4
        run: python3 scripts/finalize_kitchen_v4.py
      - name: Route login to TechPro Kitchen V4.2 base
        run: python3 scripts/route_kitchen_v42.py
      - name: Add TechPro TemporaryOrders API resolver
        run: python3 scripts/finalize_kitchen_v43.py
      - name: Switch KDS to TechPro Cloud polling
        run: python3 scripts/finalize_kitchen_v44.py
      - name: Stabilize official API and session isolation
        run: python3 scripts/finalize_kitchen_v45.py
      - name: Apply login baseline and no-flicker deltas
        run: python3 scripts/finalize_kitchen_v46.py
      - name: Auto-detect TechPro API and merge order feeds
        run: python3 scripts/finalize_kitchen_v47.py
      - run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TechPro-Kitchen-v4.7-dual-api-debug
          path: app/build/outputs/apk/debug/app-debug.apk
