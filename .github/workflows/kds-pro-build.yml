name: Build TechLight Kitchen Pro APK

on:
  push:
    branches:
      - kds-hybrid-voice-phase1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Finalize existing Hybrid KDS baseline
        run: |
          python3 scripts/finalize_kitchen_v4.py
          python3 scripts/route_kitchen_v42.py
          python3 scripts/finalize_kitchen_v43.py
          python3 scripts/finalize_kitchen_v44.py
          python3 scripts/finalize_kitchen_v45.py
          python3 scripts/finalize_kitchen_v46.py
          python3 scripts/finalize_kitchen_v47.py
          python3 scripts/finalize_kitchen_v48.py
      - name: Materialize Kitchen Pro source layer
        run: python3 scripts/apply_kitchen_pro_sources.py
      - name: Apply Kitchen Pro 7.0 production layer
        run: python3 scripts/finalize_kitchen_pro.py
      - name: Repair and verify generated Kitchen Pro sources
        run: python3 scripts/fix_kitchen_pro_build.py
      - name: Unit tests and APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Collect reports and generated sources
        if: always()
        run: |
          mkdir -p build-reports/generated-source
          cp -R app/build/reports build-reports/ 2>/dev/null || true
          cp -R app/build/test-results build-reports/ 2>/dev/null || true
          cp app/src/main/java/sa/techlight/customerdisplay/KitchenProActivity.java build-reports/generated-source/ 2>/dev/null || true
          cp app/src/main/java/sa/techlight/customerdisplay/KitchenProMetadataStore.java build-reports/generated-source/ 2>/dev/null || true
          cp app/src/main/java/sa/techlight/customerdisplay/KitchenVoiceIntentParser.java build-reports/generated-source/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TechLight-Kitchen-Pro-v7.0.0-build-reports
          path: build-reports
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TechLight-Kitchen-Pro-v7.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
