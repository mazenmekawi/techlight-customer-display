name: Build PP9000EU v1.6
on:
  workflow_dispatch:
  push:
    branches: [ techlight-printer-setup ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build PP9000EU v1.6
        working-directory: printer_setup
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Techlight-PP9000EU-Setup-v1.6
          path: printer_setup/app/build/outputs/apk/debug/app-debug.apk
