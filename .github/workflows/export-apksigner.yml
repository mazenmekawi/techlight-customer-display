name: Export Android APK signing tools

on:
  push:
    branches: [ kds-v67-exact-apk-hotfix ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Package apksigner and zipalign
        shell: bash
        run: |
          set -euxo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BT"
          mkdir -p dist/lib dist/lib64
          cp "$BT/apksigner" dist/
          cp "$BT/zipalign" dist/
          cp "$BT/lib/apksigner.jar" dist/lib/
          LIBCPP="$BT/lib64/libc++.so"
          test -f "$LIBCPP"
          cp "$LIBCPP" dist/lib64/
          chmod +x dist/apksigner dist/zipalign
          "$BT/apksigner" version | tee dist/version.txt
          LD_LIBRARY_PATH="$BT/lib64" "$BT/zipalign" -h > dist/zipalign-help.txt 2>&1 || true
          ldd "$BT/zipalign" | tee dist/zipalign-ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tools-with-libcpp
          path: dist/
          retention-days: 7
          if-no-files-found: error
