name: Build TechLight Kitchen 6.7.1 Compact No Voice

on:
  push:
    branches: [ kds-v671-compact-no-voice ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kds-v671-compact-no-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-stable-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate the existing stable hybrid KDS baseline
        run: |
          python3 scripts/finalize_kitchen_v4.py
          python3 scripts/route_kitchen_v42.py
          python3 scripts/finalize_kitchen_v43.py
          python3 scripts/finalize_kitchen_v44.py
          python3 scripts/finalize_kitchen_v45.py
          python3 scripts/finalize_kitchen_v46.py
          python3 scripts/finalize_kitchen_v47.py
          python3 scripts/finalize_kitchen_v48.py
          python3 scripts/apply_kds_stable_sources.py
          python3 scripts/finalize_kitchen_stable_v68.py

      - name: Apply compact no-voice 6.7.1 hotfix
        run: python3 scripts/finalize_kitchen_v671_compact.py

      - name: Audit the requested behavior before compiling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_kitchen_v671_compact.py
          grep -q "versionName '6.7.1-stable-hotfix'" app/build.gradle
          grep -q 'android:name=".KitchenStableActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".KitchenQrPairingActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          ! grep -q 'android.hardware.microphone' app/src/main/AndroidManifest.xml
          ! grep -q 'KitchenVoiceController' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          ! grep -q 'Hi TechPro' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'Comparator.comparingLong(this::stableCreatedAt)' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'new TimerRef(timer, startedAt' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'طلب #' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'إضافات على الطلب:' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'acknowledgeAdditions(order)' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'beepModified()' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'beepLate()' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'Temporary carts stay outside the kitchen queue.' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
          grep -q 'root.addView(header, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(50)))' app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java

      - name: Run unit tests and assemble APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Verify the built APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" > apk-zip-check.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" | tee apk-signature-check.txt
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep -q 'android.permission.CAMERA' apk-permissions.txt
          ! grep -q 'android.permission.RECORD_AUDIO' apk-permissions.txt

      - name: Package installable APK and verification files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TechLight-Kitchen-Stable-v6.7.1-Compact-NoVoice.apk
          sha256sum dist/TechLight-Kitchen-Stable-v6.7.1-Compact-NoVoice.apk | tee dist/SHA256SUMS.txt
          cp build.log apk-zip-check.txt apk-signature-check.txt apk-permissions.txt dist/
          cat > dist/README-AR.txt <<'EOF'
          TechLight Kitchen Stable v6.7.1 — Compact No Voice

          إصلاح محدود مبني على مسار المطبخ الهجين المستقر، بدون تغيير ملفات الاتصال الأساسية:
          - إزالة الأوامر الصوتية وصلاحية الميكروفون بالكامل من شاشة التشغيل.
          - هيدر صغير بدون الصورة الكبيرة لزيادة مساحة عرض الطلبات.
          - إظهار رقم الطلب الحقيقي القادم من TechPro؛ وعند عدم وجود رقم مستقل يُعرض رقم الفاتورة نفسه بدون اختراع رقم.
          - ترتيب ثابت من الأقدم إلى الأحدث.
          - مؤقت ثابت يعتمد على أول وقت محفوظ للطلب ولا يبدأ من الصفر عند تحديث المحتوى.
          - بطاقة واحدة لنفس الفاتورة مع تنبيه وصوت مختلف عند إضافة صنف أو زيادة كمية.
          - بقاء تنبيه الإضافات حتى يضغط الموظف تمت المراجعة.
          - إنذار قوي ومتكرر للطلب المتأخر وفق إعدادات الدقائق.
          - بطاقات مدمجة وتمرير للشاشة عند كثرة الطلبات.
          - مسح QR بالكاميرا مع إبقاء إدخال IP اليدوي كحل احتياطي.
          - الطلبات المؤقتة لا تدخل شاشة المطبخ.

          هذه نسخة اختبار ميداني موقعة بتوقيع Debug. لا تحذف نسخة 6.7 العاملة قبل اختبار الربط على جهاز احتياطي.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: TechLight-Kitchen-Stable-v6.7.1-Compact-NoVoice
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Upload generated-source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TechLight-Kitchen-Stable-v6.7.1-diagnostics
          path: |
            build.log
            app/src/main/java/sa/techlight/customerdisplay/KitchenStableActivity.java
            app/src/main/java/sa/techlight/customerdisplay/KitchenStableMetaStore.java
            app/src/main/AndroidManifest.xml
            app/build.gradle
          retention-days: 7
          if-no-files-found: warn
