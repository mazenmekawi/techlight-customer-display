name: Build Flutter Analyzer
on:
  push:
    branches: [ techpro-kitchen-v1 ]
  workflow_dispatch:
jobs:
  prepare-analyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Download flutterdec Linux release
        run: |
          set -euxo pipefail
          mkdir -p /tmp/flutterdec-release
          curl --fail --location --retry 3 \
            https://github.com/caverav/flutterdec/releases/download/v0.1.0-alpha.4/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz \
            --output /tmp/flutterdec.tar.gz
          tar -xzf /tmp/flutterdec.tar.gz -C /tmp/flutterdec-release
          BIN="$(find /tmp/flutterdec-release -type f -name flutterdec | head -n 1)"
          test -n "$BIN"
          chmod +x "$BIN"
          cp "$BIN" /tmp/flutterdec
          /tmp/flutterdec --help > /tmp/flutterdec-help.txt 2>&1
          sha256sum /tmp/flutterdec > /tmp/flutterdec.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: flutterdec-linux-x64
          path: |
            /tmp/flutterdec
            /tmp/flutterdec-help.txt
            /tmp/flutterdec.sha256
