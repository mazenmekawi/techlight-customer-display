name: Build Flutter Analyzer
on:
  push:
    branches: [ techpro-kitchen-v1 ]
  workflow_dispatch:
jobs:
  build-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache: false
      - name: Clone and build unflutter
        run: |
          set -euxo pipefail
          rm -rf /tmp/unflutter-src
          git clone --depth 1 https://github.com/zboralski/unflutter.git /tmp/unflutter-src
          cd /tmp/unflutter-src
          go build -trimpath -o /tmp/unflutter ./cmd/unflutter
          /tmp/unflutter --help > /tmp/unflutter-help.txt 2>&1 || true
          sha256sum /tmp/unflutter > /tmp/unflutter.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: unflutter-linux-amd64
          path: |
            /tmp/unflutter
            /tmp/unflutter-help.txt
            /tmp/unflutter.sha256
